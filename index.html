<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="min-h-screen bg-gray-100 py-10 px-40">
    <div class="mx-auto max-w-3xl">
      
      <!-- Form Card -->
      <div class="rounded-2xl bg-white p-8 shadow-lg">
        
        <!-- Header -->
        <div class="mb-8 border-b border-gray-200 pb-6">
          <h1 class="text-3xl font-bold text-gray-800">
            Student Registration Form
          </h1>
          <p class="mt-2 text-sm text-gray-500">
            Please fill in the information below to register the student.
          </p>
        </div>

        <form class="space-y-8">

          <!-- Personal Information -->
          <div>
            <h2 class="mb-5 text-xl font-semibold text-gray-800">
              Personal Information
            </h2>

            <div class="grid grid-cols-1 gap-5 md:grid-cols-2">

              <!-- First Name -->
              <div>
                <label
                  for="firstName"
                  class="mb-2 block text-sm font-medium text-gray-700"
                >
                  First Name
                </label>

                <input
                  type="text"
                  id="firstName"
                  name="firstName"
                  placeholder="Enter first name"
                  class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                />
              </div>

              <!-- Last Name -->
              <div>
                <label
                  for="lastName"
                  class="mb-2 block text-sm font-medium text-gray-700"
                >
                  Last Name
                </label>

                <input
                  type="text"
                  id="lastName"
                  name="lastName"
                  placeholder="Enter last name"
                  class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                />
              </div>

              <!-- Email -->
              <div>
                <label
                  for="email"
                  class="mb-2 block text-sm font-medium text-gray-700"
                >
                  Email Address
                </label>

                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="student@example.com"
                  class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                />
              </div>

              <!-- Phone -->
              <div>
                <label
                  for="phone"
                  class="mb-2 block text-sm font-medium text-gray-700"
                >
                  Phone Number
                </label>

                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  placeholder="+92 300 1234567"
                  class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                />
              </div>

              <!-- Date of Birth -->
              <div>
                <label
                  for="dob"
                  class="mb-2 block text-sm font-medium text-gray-700"
                >
                  Date of Birth
                </label>

                <input
                  type="date"
                  id="dob"
                  name="dob"
                  class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                />
              </div>

              <!-- Gender -->
              <div>
                <label
                  for="gender"
                  class="mb-2 block text-sm font-medium text-gray-700"
                >
                  Gender
                </label>

                <select
                  id="gender"
                  name="gender"
                  class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                >
                  <option value="">Select gender</option>
                  <option value="male">Male</option>
                  <option value="female">Female</option>
                  <option value="other">Other</option>
                </select>
              </div>

            </div>
          </div>

          <!-- Academic Information -->
          <div class="border-t border-gray-200 pt-8">
            <h2 class="mb-5 text-xl font-semibold text-gray-800">
              Academic Information
            </h2>

            <div class="grid grid-cols-1 gap-5 md:grid-cols-2">

              <!-- Student ID -->
              <div>
                <label
                  for="studentId"
                  class="mb-2 block text-sm font-medium text-gray-700"
                >
                  Student ID
                </label>

                <input
                  type="text"
                  id="studentId"
                  name="studentId"
                  placeholder="e.g. STU-001"
                  class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                />
              </div>

              <!-- Course -->
              <div>
                <label
                  for="course"
                  class="mb-2 block text-sm font-medium text-gray-700"
                >
                  Course
                </label>

                <select
                  id="course"
                  name="course"
                  class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                >
                  <option value="">Select course</option>
                  <option value="web-development">Web Development</option>
                  <option value="graphic-design">Graphic Design</option>
                  <option value="digital-marketing">Digital Marketing</option>
                  <option value="computer-science">Computer Science</option>
                  <option value="software-engineering">
                    Software Engineering
                  </option>
                </select>
              </div>

              <!-- Department -->
              <div>
                <label
                  for="department"
                  class="mb-2 block text-sm font-medium text-gray-700"
                >
                  Department
                </label>

                <select
                  id="department"
                  name="department"
                  class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                >
                  <option value="">Select department</option>
                  <option value="computer-science">Computer Science</option>
                  <option value="business">Business</option>
                  <option value="arts">Arts</option>
                  <option value="engineering">Engineering</option>
                </select>
              </div>

              <!-- Enrollment Year -->
              <div>
                <label
                  for="year"
                  class="mb-2 block text-sm font-medium text-gray-700"
                >
                  Enrollment Year
                </label>

                <select
                  id="year"
                  name="year"
                  class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                >
                  <option value="">Select year</option>
                  <option value="2026">2026</option>
                  <option value="2025">2025</option>
                  <option value="2024">2024</option>
                  <option value="2023">2023</option>
                </select>
              </div>

            </div>
          </div>

          <!-- Address -->
          <div class="border-t border-gray-200 pt-8">
            <h2 class="mb-5 text-xl font-semibold text-gray-800">
              Address Information
            </h2>

            <div class="space-y-5">

              <div>
                <label
                  for="address"
                  class="mb-2 block text-sm font-medium text-gray-700"
                >
                  Address
                </label>

                <textarea
                  id="address"
                  name="address"
                  rows="3"
                  placeholder="Enter complete address"
                  class="w-full resize-none rounded-lg border border-gray-300 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                ></textarea>
              </div>

              <div class="grid grid-cols-1 gap-5 md:grid-cols-2">

                <div>
                  <label
                    for="city"
                    class="mb-2 block text-sm font-medium text-gray-700"
                  >
                    City
                  </label>

                  <input
                    type="text"
                    id="city"
                    name="city"
                    placeholder="Enter city"
                    class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                  />
                </div>

                <div>
                  <label
                    for="country"
                    class="mb-2 block text-sm font-medium text-gray-700"
                  >
                    Country
                  </label>

                  <select
                    id="country"
                    name="country"
                    class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                  >
                    <option value="">Select country</option>
                    <option value="pakistan">Pakistan</option>
                    <option value="india">India</option>
                    <option value="uae">United Arab Emirates</option>
                    <option value="uk">United Kingdom</option>
                    <option value="usa">United States</option>
                  </select>
                </div>

              </div>
            </div>
          </div>

          <!-- Emergency Contact -->
          <div class="border-t border-gray-200 pt-8">
            <h2 class="mb-5 text-xl font-semibold text-gray-800">
              Emergency Contact
            </h2>

            <div class="grid grid-cols-1 gap-5 md:grid-cols-2">

              <div>
                <label
                  for="guardianName"
                  class="mb-2 block text-sm font-medium text-gray-700"
                >
                  Guardian Name
                </label>

                <input
                  type="text"
                  id="guardianName"
                  name="guardianName"
                  placeholder="Enter guardian name"
                  class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                />
              </div>

              <div>
                <label
                  for="guardianPhone"
                  class="mb-2 block text-sm font-medium text-gray-700"
                >
                  Guardian Phone
                </label>

                <input
                  type="tel"
                  id="guardianPhone"
                  name="guardianPhone"
                  placeholder="+92 300 1234567"
                  class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                />
              </div>

            </div>
          </div>

          <!-- Terms -->
          <div class="border-t border-gray-200 pt-6">
            <label class="flex items-start gap-3">
              <input
                type="checkbox"
                name="terms"
                class="mt-1 h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500"
              />

              <span class="text-sm text-gray-600">
                I confirm that all the information provided above is correct
                and complete.
              </span>
            </label>
          </div>

          <!-- Buttons -->
          <div class="flex flex-col gap-3 border-t border-gray-200 pt-6 sm:flex-row sm:justify-end">

            <button
              type="reset"
              class="rounded-lg border border-gray-300 px-6 py-3 text-sm font-semibold text-gray-700 transition hover:bg-gray-100"
            >
              Reset
            </button>

            <button
              type="submit"
              class="rounded-lg bg-blue-600 px-6 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
            >
              Register Student
            </button>

          </div>

        </form>
      </div>

      <!-- Footer -->
      <p class="mt-5 text-center text-sm text-gray-500">
        © 2026 Student Registration System
      </p>

    </div>
  </body>
</html>
